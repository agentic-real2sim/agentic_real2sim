        sysid_agent:
          type: llm
          models:
          - anthropic:claude-sonnet-4-6
          temperature: null
          max_tokens: 8192
          response_policy: single
  g1sysid:
    main:
      motion_reader_agent:
        type: llm
        models:
        - anthropic:claude-sonnet-4-6
        temperature: null
        max_tokens: 8192
